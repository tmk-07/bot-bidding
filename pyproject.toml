[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "item-auction"
version = "0.1.0"
description = "A trainable sequential ascending-auction environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = [
  "altair>=5.0",
  "pandas>=2.0",
  "streamlit>=1.40",
]
rl = [
  "gymnasium>=1.0",
  "numpy>=2.0",
  "pettingzoo>=1.24",
]
train = [
  "gymnasium>=1.0",
  "numpy>=2.0",
  "pettingzoo>=1.24",
  "stable-baselines3>=2.6",
  "sb3-contrib>=2.6",
]

[project.scripts]
item-auction = "item_auction.cli:main"
item-auction-train-baseline = "item_auction.rl.baseline_training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
