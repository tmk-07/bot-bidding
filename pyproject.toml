[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "item-auction"
version = "0.1.0"
description = "A trainable sequential auction environment for drafting five items."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ui = ["streamlit>=1.40"]
rl = [
  "gymnasium>=1.0",
  "numpy>=2.0",
  "pettingzoo>=1.24",
]

[project.scripts]
item-auction = "item_auction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
